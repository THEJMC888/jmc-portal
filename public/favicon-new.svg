<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>

    <!-- Background: deep navy radial with green undertone -->
    <radialGradient id="bg" cx="45%" cy="42%" r="58%">
      <stop offset="0%"   stop-color="#0e2d52"/>
      <stop offset="60%"  stop-color="#08254D"/>
      <stop offset="100%" stop-color="#030c18"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="38%" cy="62%" r="52%">
      <stop offset="0%"   stop-color="#0d4030" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0d4030" stop-opacity="0"/>
    </radialGradient>

    <!-- Inner teal glow (echoes the original's cyan heart) -->
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="40%">
      <stop offset="0%"   stop-color="#1a5a48" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1a5a48" stop-opacity="0"/>
    </radialGradient>

    <!-- Outer metallic GOLD ring -->
    <linearGradient id="ringOuter" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%"   stop-color="#4a3210"/>
      <stop offset="12%"  stop-color="#b88c3a"/>
      <stop offset="25%"  stop-color="#F0DFA0"/>
      <stop offset="38%"  stop-color="#C29F60"/>
      <stop offset="50%"  stop-color="#7a5318"/>
      <stop offset="63%"  stop-color="#EDD98A"/>
      <stop offset="78%"  stop-color="#C29F60"/>
      <stop offset="90%"  stop-color="#d4b47a"/>
      <stop offset="100%" stop-color="#4a3210"/>
    </linearGradient>
    <linearGradient id="ringInner" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%"   stop-color="#2a1c08" stop-opacity="0.9"/>
      <stop offset="40%"  stop-color="#c29f60" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#2a1c08" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Warm metallic gold for ∞ — simulates lit-from-top 3D tube -->
    <linearGradient id="goldTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#FFF8E8"/>  <!-- bright specular top -->
      <stop offset="12%"  stop-color="#EDD98A"/>  <!-- light gold -->
      <stop offset="28%"  stop-color="#C29F60"/>  <!-- brand gold -->
      <stop offset="44%"  stop-color="#7A5218"/>  <!-- mid shadow -->
      <stop offset="50%"  stop-color="#4A3010"/>  <!-- deep shadow at equator -->
      <stop offset="56%"  stop-color="#7A5218"/>  <!-- mid shadow -->
      <stop offset="72%"  stop-color="#C29F60"/>  <!-- brand gold -->
      <stop offset="88%"  stop-color="#D4B47A"/>  <!-- light gold -->
      <stop offset="100%" stop-color="#9A7830"/>  <!-- base gold -->
    </linearGradient>

    <!-- Specular highlight streak (thinner overlay on top of body) -->
    <linearGradient id="specular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#FFFEF8" stop-opacity="1"/>
      <stop offset="22%"  stop-color="#FFF5D0" stop-opacity="0.6"/>
      <stop offset="45%"  stop-color="#EDD98A" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#EDD98A" stop-opacity="0"/>
    </linearGradient>

    <!-- Shadow/depth gradient for drop shadow under ∞ -->
    <linearGradient id="dropShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.1"/>
    </linearGradient>

  </defs>

  <!-- ── Background ── -->
  <circle cx="200" cy="200" r="200" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="200" fill="url(#greenGlow)"/>
  <circle cx="200" cy="200" r="200" fill="url(#innerGlow)"/>

  <!-- ── Outer ring — shadow base ── -->
  <circle cx="200" cy="200" r="190" fill="none"
    stroke="rgba(0,0,0,0.65)" stroke-width="26"/>

  <!-- ── Outer ring — gold metallic body ── -->
  <circle cx="200" cy="200" r="190" fill="none"
    stroke="url(#ringOuter)" stroke-width="20"/>

  <!-- ── Outer ring — inner dark edge ── -->
  <circle cx="200" cy="200" r="180" fill="none"
    stroke="url(#ringInner)" stroke-width="3"/>

  <!-- ∞ Infinity symbol
       Two loops drawn separately so the right crosses OVER the left.
       Coordinates: viewBox 400×400, center 200,200
       Each loop is an elongated oval, semi-major ~118, semi-minor ~58
  -->

  <!-- LEFT loop — drawn first (behind) -->
  <!-- Drop shadow -->
  <path fill="none"
    stroke="rgba(0,0,0,0.7)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"
    transform="translate(3,6)"
    d="M200,200 C185,142 68,138 72,200 C76,262 185,258 200,200"/>

  <!-- Metallic body -->
  <path fill="none"
    stroke="url(#goldTop)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"
    d="M200,200 C185,142 68,138 72,200 C76,262 185,258 200,200"/>

  <!-- Specular sheen -->
  <path fill="none"
    stroke="url(#specular)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"
    d="M200,200 C185,142 68,138 72,200 C76,262 185,258 200,200"/>

  <!-- RIGHT loop — drawn on top (in front at the crossing) -->
  <!-- Drop shadow -->
  <path fill="none"
    stroke="rgba(0,0,0,0.7)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"
    transform="translate(3,6)"
    d="M200,200 C215,142 332,138 328,200 C324,262 215,258 200,200"/>

  <!-- Metallic body -->
  <path fill="none"
    stroke="url(#goldTop)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"
    d="M200,200 C215,142 332,138 328,200 C324,262 215,258 200,200"/>

  <!-- Specular sheen -->
  <path fill="none"
    stroke="url(#specular)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"
    d="M200,200 C215,142 332,138 328,200 C324,262 215,258 200,200"/>

  <!-- ── Centre crossing glow — where the loops meet ── -->
  <circle cx="200" cy="200" r="14" fill="rgba(237,217,138,0.18)"/>
  <circle cx="200" cy="200" r="7"  fill="rgba(255,248,220,0.22)"/>

</svg>
